{% extends 'base.html' %}
{% block title %}Contact | Pet World{% endblock %}
{% block content %}
<div class="page-title">
  <h1>Contact Us</h1>
  <p>Send a basic message (demo form).</p>
</div>

{% if message_sent %}
<div class="alert">Thanks! Your message was received.</div>
{% endif %}

<form class="form card" method="post">
  {% csrf_token %}
  <label>Name
    <input type="text" name="name" required placeholder="Your name">
  </label>
  <label>Email
    <input type="email" name="email" required placeholder="you@email.com">
  </label>
  <label>Message
    <textarea name="message" rows="4" required placeholder="Write your message..."></textarea>
  </label>
  <button class="btn btn-primary" type="submit">Send Message</button>
</form>
{% endblock %}
